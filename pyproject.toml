[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fhew"
version = "0.1.0"
description = "Sensor-aware Bayesian hypothesis bank for frequency-hopping generator identification (FH-EW gym core)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ehsan" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.6", "pandas>=1.5"]
torch = ["torch>=2.0"]
dev = ["pytest>=7.0"]

[project.scripts]
fhew-generate = "fhew.datagen:main"
fhew-run = "scripts.run_all:main"

[tool.setuptools.packages.find]
include = ["fhew*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
